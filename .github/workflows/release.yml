name: Release

on:
  push:
    tags: ["v*"]
  # Releases main from the Actions tab: the workflow creates the tag itself.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v1.2.0, or v1.3.0-rc.1 for a pre-release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the draft of the release
      pull-requests: read # for the release notes
      id-token: write # signs the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the release notes
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test -race ./...
      # Tags pushed with the workflow's token start no further workflow, so this run releases it.
      # A run that failed after pushing the tag can be repeated for the same commit.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Invalid version: $VERSION"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            [ "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)" ] || { echo "::error::$VERSION already tags another commit"; exit 1; }
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
      # Collects the "Release notes" sections of the pull requests since the previous release.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.2
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version || github.ref_name }}
      # Proves that the files of the release were built here, from this tag:
      # gh attestation verify <file> --repo QwikByte/noryx
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

  # Signs checksums.txt with the secret RELEASE_SIGNING_KEY and publishes the release. A job of its own,
  # so that nothing of the build, e.g. a dependency of the panel, runs on a machine that has the key.
  sign:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # publishes the release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "::error::The secret RELEASE_SIGNING_KEY is missing"; exit 1; }
          gh release download "$TAG" --pattern checksums.txt --pattern install.sh
          openssl pkeyutl -sign -rawin -inkey /dev/stdin -in checksums.txt -out checksums.txt.sig <<<"$RELEASE_SIGNING_KEY"
      # Fails if the secret doesn't belong to the key in the installer, which would refuse the release.
      - name: Verify the signature with the release's installer
        run: |
          sha256sum -c --ignore-missing --strict checksums.txt
          key=$(sed -n 's/^readonly RELEASE_KEY=//p' install.sh)
          openssl pkeyutl -verify -pubin -rawin -in checksums.txt -sigfile checksums.txt.sig \
            -inkey <(printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$key")
      - name: Publish the release
        run: |
          gh release upload "$TAG" checksums.txt.sig --clobber
          gh release edit "$TAG" --draft=false
