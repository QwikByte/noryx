version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 0.6.1 and 0.6.2 hand response hooks a copy of the response, so the agent can't refuse the wrong runtime.
      - dependency-name: github.com/moby/moby/client
        versions: ["0.6.1", "0.6.2"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
