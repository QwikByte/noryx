syntax = "proto3";

package noryx.v1;

import "noryx/v1/server.proto";

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// NodeService is served by every agent and describes the machine it runs on.
service NodeService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse);
  // CreateCSR makes the agent generate a new key pair and returns a certificate
  // signing request for it. The private key never leaves the node.
  rpc CreateCSR(CreateCSRRequest) returns (CreateCSRResponse);
  // InstallCertificate activates a certificate issued for the key of the latest
  // CreateCSR call. New connections use it right away; no restart is needed.
  rpc InstallCertificate(InstallCertificateRequest) returns (InstallCertificateResponse);
  // Update installs a release of Noryx that is newer than the agent, in a
  // systemd unit of its own. The agent restarts on it; servers keep running.
  rpc Update(UpdateRequest) returns (UpdateResponse);
  // Configure gives the agent the settings of its node that it applies itself, which it
  // keeps across restarts.
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
}

message GetInfoRequest {}

message GetInfoResponse {
  string agent_version = 1;
  string hostname = 2;
  string os = 3;
  uint32 cpu_count = 4;
  uint64 memory_bytes = 5;
  // Where servers can keep their data; the default location comes first.
  repeated StorageLocation storage = 7;
  // When the certificate the agent presents to the master expires.
  int64 certificate_not_after_unix = 8;
  // The container runtime the agent is set to use, "docker" or "podman", also while it
  // can't reach it, and its version, e.g. "29.0.0", empty then; os, cpu_count and
  // memory_bytes are empty then too.
  string runtime_name = 9;
  string runtime_version = 10;
  // The settings the agent applies.
  NodeSettings settings = 11;
  // The types of servers the agent creates, e.g. for the panel to offer only those.
  repeated ServerType server_types = 12;
}

// StorageLocation is a directory the node's administrator allowed for server data.
message StorageLocation {
  string name = 1;
  string path = 2;
  uint64 free_bytes = 3;
  uint64 total_bytes = 4;
}

message CreateCSRRequest {}

message CreateCSRResponse {
  bytes csr_der = 1;
}

message InstallCertificateRequest {
  bytes certificate_der = 1;
}

message InstallCertificateResponse {}

message UpdateRequest {
  // Release to install, e.g. "v1.2.0".
  string version = 1;
}

message UpdateResponse {}

// NodeSettings are what the master chose for a node and its agent applies itself, within the
// bounds that NodeSettings.Problem checks.
message NodeSettings {
  // The containers that the agent creates from now on keep log_files files of up to
  // log_file_mb MB of their output. 0 for both leaves it to the runtime's configuration.
  uint32 log_file_mb = 1;
  uint32 log_files = 2;
  // The space in GiB that uploads and backups leave free on a file system.
  uint32 keep_free_gb = 3;
  // The seconds between two measurements of what the node and its servers use.
  uint32 stats_interval_seconds = 4;
}

message ConfigureRequest {
  NodeSettings settings = 1;
}

message ConfigureResponse {}
