syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// ServerService is served by every agent and manages the Minecraft servers on its node.
service ServerService {
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  rpc StartServer(StartServerRequest) returns (StartServerResponse);
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  // RestartServer stops a server gracefully and starts it again.
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse);
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);
  // UpdateServer changes the settings of a server. Its container is created again with
  // the same data, and a running server restarts.
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // UpdateImage pulls the image of a server again, e.g. for a newer Java. If it changed, the
  // container is created again with it, and a running server restarts.
  rpc UpdateImage(UpdateImageRequest) returns (UpdateImageResponse);
  // StreamLogs sends the last lines of the server console, then follows it until the
  // server stops or the client disconnects. Each line has the time it was written, for
  // clients that connect again to continue after the last line they got.
  rpc StreamLogs(StreamLogsRequest) returns (stream StreamLogsResponse);
  // SendCommand runs a console command and returns its output.
  rpc SendCommand(SendCommandRequest) returns (SendCommandResponse);
  // ConfigureNetwork gives a server its role in a network behind a proxy, in the
  // configuration files of the proxy or game server: a proxy gets its backends and reloads
  // its configuration if it runs, a game server accepts only players forwarded by the proxy
  // and restarts if it runs, and FORWARDING_NONE makes a game server standalone again.
  rpc ConfigureNetwork(ConfigureNetworkRequest) returns (ConfigureNetworkResponse);
  // DuplicateServer creates a server on the same node with a copy of the data and the
  // settings of another one. A running game server saves its worlds first. The copy is
  // stopped and standalone: it doesn't take over the network role of the original.
  rpc DuplicateServer(DuplicateServerRequest) returns (DuplicateServerResponse);
  // ImportServer creates a stopped server with the ID and settings of a server of another
  // node, e.g. one that moves here. The header describes it, the data that follows is its
  // data directory as a ZIP archive, like ArchiveDirectory sends it.
  rpc ImportServer(stream ImportServerRequest) returns (ImportServerResponse);
  // CreateServerFromArchive creates a stopped server like CreateServer, whose data is a ZIP or
  // .tar.gz archive from elsewhere, e.g. of a server at a host. The header describes the
  // server, the data that follows is the archive. Unlike ImportServer, the archive is
  // untrusted: the agent checks it like an archive of the file manager, leaves out the files
  // with secrets and those it writes itself, and replaces the secrets and the forwarding
  // settings in the others. Nothing of the server remains if that fails. Agents of older
  // versions answer UNIMPLEMENTED.
  rpc CreateServerFromArchive(stream CreateServerFromArchiveRequest) returns (CreateServerFromArchiveResponse);
}

enum ServerType {
  SERVER_TYPE_UNSPECIFIED = 0;
  SERVER_TYPE_VANILLA = 1;
  SERVER_TYPE_PAPER = 2;
  SERVER_TYPE_PURPUR = 3;
  SERVER_TYPE_FABRIC = 4;
  SERVER_TYPE_FORGE = 5;
  SERVER_TYPE_NEOFORGE = 6;
  // Proxies connect several servers to one network.
  SERVER_TYPE_VELOCITY = 7;
  SERVER_TYPE_BUNGEECORD = 8;
  SERVER_TYPE_WATERFALL = 9;
  // Forks of Paper with its configuration: Folia runs regions of the worlds in parallel and
  // only loads plugins made for it, Leaf optimises performance.
  SERVER_TYPE_FOLIA = 10;
  SERVER_TYPE_LEAF = 11;
  // Quilt loads its own mods and those of Fabric.
  SERVER_TYPE_QUILT = 12;
}

// RestartPolicy decides when the node starts a server on its own.
enum RestartPolicy {
  // Same as RESTART_POLICY_ALWAYS.
  RESTART_POLICY_UNSPECIFIED = 0;
  // Start with the node and after a crash, unless the server was stopped.
  RESTART_POLICY_ALWAYS = 1;
  // Start again after a crash.
  RESTART_POLICY_ON_CRASH = 2;
  // Only start when asked to.
  RESTART_POLICY_NEVER = 3;
}

enum ServerState {
  SERVER_STATE_UNSPECIFIED = 0;
  SERVER_STATE_STOPPED = 1;
  SERVER_STATE_STARTING = 2;
  SERVER_STATE_RUNNING = 3;
  // The server crashed and the node starts it again. After several crashes in a row, the
  // agent stops it.
  SERVER_STATE_CRASHING = 4;
}

message Server {
  string id = 1;
  string name = 2;
  ServerType type = 3;
  // Minecraft version, e.g. "1.21.4" or "LATEST".
  string version = 4;
  uint32 memory_mb = 5;
  uint32 port = 6;
  ServerState state = 7;
  // Storage location of the server's data on the node.
  string storage = 8;
  // Java version of game servers, e.g. "21"; empty for the newest.
  string java = 9;
  RestartPolicy restart_policy = 10;
  // Use the JVM flags recommended by Aikar for Paper and its forks.
  bool aikar_flags = 11;
  // Additional JVM options, e.g. "-Dfile.encoding=UTF-8".
  repeated string jvm_options = 12;
  // CPU limit in thousandths of a core; 0 means no limit.
  uint32 cpu_millis = 13;
  // How often a crashing server, or one that stopped after a crash, crashed since it was
  // last started; 0 for servers that run or stopped cleanly.
  uint32 crashes = 14;
  // Exit code of the latest crash, if known.
  int32 exit_code = 15;
  // Version of the mod loader of Fabric, Quilt, Forge and NeoForge servers, e.g. "0.16.10";
  // empty for the newest.
  string loader_version = 16;
  // For a proxy whose network lets Bedrock players join: the UDP port at which Geyser
  // listens for them; 0 for none.
  uint32 bedrock_port = 17;
  // JVM options that were set before the agent refused them, e.g. as they can run code. The
  // server still starts with them until they are removed in its settings.
  repeated string refused_jvm_options = 18;
  // The node publishes the port of the backend only at its address in the private network of
  // the nodes, for the node of its proxy.
  bool overlay = 19;
  // A running server whose health check fails, e.g. one that hangs. Actions treat it like any
  // running server.
  bool unhealthy = 20;
  // Seconds the server gets to stop gracefully, e.g. to save its worlds, before it is killed; 0
  // for the default of 60, as older agents report it.
  uint32 stop_timeout_seconds = 21;
  // IANA time zone of the server, e.g. "Europe/Berlin"; empty for UTC.
  string time_zone = 22;
  // Ports of plugins that the node publishes, e.g. of a web map; agents of older versions have none.
  repeated ExtraPort extra_ports = 23;
  // Minutes a game server gets to start before its failed health checks count, e.g. as a large
  // modpack loads; 0 for the default of 2, as older agents report it.
  uint32 health_start_minutes = 24;
  // Crashes in a row after which the agent stops the server; 0 for the default of 5, as older
  // agents report it.
  uint32 crash_limit = 25;
  // Minutes a run of the server must last to end a row of crashes; 0 for the default of 10.
  uint32 stable_after_minutes = 26;
  // Minutes after which the agent restarts a running server that stays unhealthy, which counts as
  // a crash; 0 for never.
  uint32 unhealthy_restart_minutes = 27;
  // Processes and threads the server's container may run; 0 for the default of 1024, as older
  // agents report it.
  uint32 process_limit = 28;
  // Initial heap in MB, below memory_mb; 0 for the same as memory_mb.
  uint32 init_memory_mb = 29;
}

// ExtraPort is a port of a plugin of a server, e.g. of a web map or a voice chat, which the node
// publishes on all its addresses at the same port of the container, where the plugin listens.
message ExtraPort {
  // From 1024 to 65535, neither the server's own port nor its Bedrock port, nor one its container
  // uses itself: 25565, 25575 (RCON) and 25577.
  uint32 port = 1;
  // "tcp" or "udp".
  string protocol = 2;
  // Plain text of up to 32 characters, e.g. "Map".
  string label = 3;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message CreateServerRequest {
  string name = 1;
  ServerType type = 2;
  string version = 3;
  uint32 memory_mb = 4;
  uint32 port = 5;
  // The operator must accept the Minecraft EULA (https://aka.ms/MinecraftEULA) for a game
  // server; proxies don't run Minecraft.
  bool accept_eula = 6;
  // Storage location for the server's data; empty means the default location.
  string storage = 7;
  // Settings as in UpdateServerRequest.
  string java = 8;
  RestartPolicy restart_policy = 9;
  bool aikar_flags = 10;
  repeated string jvm_options = 11;
  uint32 cpu_millis = 12;
  // Properties of server.properties for a game server, written before its first start.
  map<string, string> properties = 13;
  string loader_version = 14;
  uint32 stop_timeout_seconds = 15;
  string time_zone = 16;
  repeated ExtraPort extra_ports = 17;
  uint32 health_start_minutes = 18;
  uint32 crash_limit = 19;
  uint32 stable_after_minutes = 20;
  uint32 unhealthy_restart_minutes = 21;
  uint32 process_limit = 22;
  uint32 init_memory_mb = 23;
}

message CreateServerResponse {
  Server server = 1;
}

message StartServerRequest {
  string id = 1;
}

message StartServerResponse {}

message StopServerRequest {
  string id = 1;
}

message StopServerResponse {}

message RestartServerRequest {
  string id = 1;
}

message RestartServerResponse {}

message UpdateServerRequest {
  string id = 1;
  string name = 2;
  string version = 3;
  uint32 memory_mb = 4;
  uint32 port = 5;
  string java = 6;
  RestartPolicy restart_policy = 7;
  bool aikar_flags = 8;
  repeated string jvm_options = 9;
  uint32 cpu_millis = 10;
  string loader_version = 11;
  // Seconds the server gets to stop gracefully, from 30 to 600; 0, as older masters send it,
  // means 60.
  uint32 stop_timeout_seconds = 12;
  // IANA time zone of the server, e.g. "Europe/Berlin", which its container gets as TZ; empty
  // for UTC.
  string time_zone = 13;
  // Up to 5 ports of plugins to publish; changing them creates the container again.
  repeated ExtraPort extra_ports = 14;
  // Minutes a game server gets to start before its failed health checks count, from 2 to 30; 0,
  // as older masters send it, means 2. Proxies keep the start period of their image.
  uint32 health_start_minutes = 15;
  // Crashes in a row, each within stable_after_minutes of its start, after which the agent stops
  // the server, from 1 to 20; 0, as older masters send it, means 5.
  uint32 crash_limit = 16;
  // Minutes a run must last to end a row of crashes, from 1 to 120; 0, as older masters send it,
  // means 10. For a restart of an unhealthy server, the run is how long it was healthy.
  uint32 stable_after_minutes = 17;
  // Minutes, from 1 to 60, after which the agent restarts a running server whose health check
  // keeps failing. It counts as a crash, so a server that keeps hanging stops after crash_limit
  // of them. 0, as older masters send it, for never.
  uint32 unhealthy_restart_minutes = 18;
  // Processes and threads the server's container may run, from 1024 to 8192; 0, as older masters
  // send it, means 1024. The limit keeps a server from exhausting the node, e.g. with a fork bomb.
  uint32 process_limit = 19;
  // Initial heap in MB, from 512 to memory_mb, without Aikar's flags, which want both the same;
  // 0, as older masters send it, for the same as memory_mb.
  uint32 init_memory_mb = 20;
}

message UpdateServerResponse {
  Server server = 1;
}

message UpdateImageRequest {
  string id = 1;
}

message UpdateImageResponse {
  // updated tells whether the image changed. If not, the server was left alone.
  bool updated = 1;
}

message DeleteServerRequest {
  string id = 1;
}

message DeleteServerResponse {}

message StreamLogsRequest {
  string id = 1;
  // Number of past lines to send first, at most 1000.
  uint32 tail = 2;
  // Leaves out the past lines up to this time, e.g. those a client that connects again
  // has already; 0 leaves out none.
  int64 after_unix_nano = 3;
}

message StreamLogsResponse {
  // The line as plain text, without colours.
  string line = 1;
  // When the server wrote the line; 0 if unknown.
  int64 time_unix_nano = 2;
  // The line with its colours and formatting in Minecraft's codes, empty if it has none: §
  // followed by 0-9 or a-f for a colour, l, m, n or o for bold, strikethrough, underlined or
  // italic text, or r to reset them. A colour resets the formatting, as in Minecraft, and
  // colours of terminals become the nearest of Minecraft's. Clients show them as styles of
  // the text, never as markup.
  string formatted = 3;
}

message SendCommandRequest {
  string id = 1;
  // A single console command, e.g. "say Hello". A leading slash is optional.
  string command = 2;
  // Don't wait for an answer to a send command that only comes if the proxy can't send the
  // player, as Velocity's, e.g. to send many players before a rolling restart.
  bool no_wait = 3;
}

message SendCommandResponse {
  // The output as plain text, without colours.
  string output = 1;
  // The output with its colours and formatting, if it has any, like StreamLogsResponse's.
  string formatted = 2;
}

message ConfigureNetworkRequest {
  string id = 1;
  // Shared secret of Velocity's modern forwarding.
  string forwarding_secret = 2;
  // Backends of a proxy.
  repeated NetworkBackend backends = 3;
  // For a backend: its proxy runs on the same node and reaches it over a Docker network,
  // so its port isn't published.
  bool proxy_on_node = 4;
  // How the proxy forwards players to its backends. Unspecified means modern forwarding
  // if a secret is set, and otherwise FORWARDING_NONE, as older masters sent it.
  Forwarding forwarding = 5;
  // For a proxy: the backends players join and fall back to, in this order. Empty means
  // the first backend, as older masters sent it.
  repeated string try = 6;
  // For a proxy: the backends players join when they connect through a host name.
  repeated ForcedHost forced_hosts = 7;
  // For a proxy: the UDP port at which Geyser lets Bedrock players join, which the node
  // publishes; 0 for none. The master installs Geyser and Floodgate.
  uint32 bedrock_port = 8;
  // For a backend: Bedrock players join it through the proxy. They can't sign their chat
  // messages, so the server must not demand it.
  bool bedrock_players = 9;
  // For a backend on another node than its proxy, both in the private network of the nodes:
  // the address of the proxy's node in it. The node publishes the backend's port only at its
  // own address in the network, and only for this one.
  string overlay_client = 10;
  // Datastores of the server's network on this node, which it reaches by the name of their
  // container, e.g. noryx-db-<id>.
  repeated string datastores = 11;
  // The public key of the proxy's node in the private network. The node publishes the port
  // only for its peer at overlay_client with this key, and closes it once that address has
  // another key. Older masters send none: then the key the peer has now.
  string overlay_client_key = 12;
}

enum Forwarding {
  FORWARDING_UNSPECIFIED = 0;
  // Not part of a network: a game server accepts players directly.
  FORWARDING_NONE = 1;
  // Velocity's modern forwarding, signed with the forwarding secret.
  FORWARDING_MODERN = 2;
  // BungeeCord's forwarding (ip_forward), which Velocity calls legacy. It doesn't prove that
  // players come through the proxy, so only the proxy may reach the backends.
  FORWARDING_LEGACY = 3;
}

message NetworkBackend {
  // Name players use, e.g. in /server lobby.
  string name = 1;
  oneof target {
    // A server on the same node as the proxy.
    string server_id = 2;
    // host:port of a server on another node.
    string address = 3;
  }
  // BungeeCord: only players with the permission bungeecord.server.<name> may join it.
  bool restricted = 4;
  // BungeeCord: the MOTD shown for host names that lead to it.
  string motd = 5;
}

// ForcedHost sends players who connect through a host name to certain backends.
message ForcedHost {
  // e.g. survival.example.com
  string host = 1;
  // Names of the backends, tried in this order. BungeeCord takes only one.
  repeated string servers = 2;
}

message ConfigureNetworkResponse {
  // A running server restarted to apply the configuration, rather than reloading it.
  bool restarted = 1;
}

message DuplicateServerRequest {
  // The server to copy.
  string id = 1;
  string name = 2;
  uint32 port = 3;
}

message DuplicateServerResponse {
  Server server = 1;
}

message ImportServerRequest {
  oneof content {
    Server header = 1;
    bytes data = 2;
  }
}

message ImportServerResponse {
  Server server = 1;
}

message CreateServerFromArchiveHeader {
  // The server to create, without properties: the archive brings its server.properties.
  CreateServerRequest server = 1;
  // Size of the archive if known, so that one that doesn't fit is refused before it is sent.
  int64 size = 2;
}

message CreateServerFromArchiveRequest {
  oneof content {
    CreateServerFromArchiveHeader header = 1;
    bytes data = 2;
  }
}

message CreateServerFromArchiveResponse {
  Server server = 1;
  // Files and folders of the archive that the server didn't get, e.g. those with secrets of
  // the server it came from; up to 100.
  repeated string left_out = 2;
}
