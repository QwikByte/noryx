syntax = "proto3";

package noryx.v1;

import "noryx/v1/properties.proto";

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// ProxyService is served by every agent and edits the settings of proxies in their own
// configuration file: velocity.toml of Velocity, config.yml of BungeeCord.
service ProxyService {
  rpc GetProxySettings(GetProxySettingsRequest) returns (GetProxySettingsResponse);
  // UpdateProxySettings changes settings that the file has and keeps the others. A running
  // proxy reloads its configuration.
  rpc UpdateProxySettings(UpdateProxySettingsRequest) returns (UpdateProxySettingsResponse);
  // GetMaintenance tells what the Maintenance plugin of a proxy keeps in its files: whether
  // maintenance is on, and which players may join meanwhile.
  rpc GetMaintenance(GetMaintenanceRequest) returns (GetMaintenanceResponse);
  // ChangeMaintenance runs a command of the Maintenance plugin on the console of a running
  // proxy, and returns once the plugin saved the change. Timers only live in the plugin, so
  // the call returns once it sent their commands.
  rpc ChangeMaintenance(ChangeMaintenanceRequest) returns (ChangeMaintenanceResponse);
}

message GetProxySettingsRequest {
  string server_id = 1;
}

message GetProxySettingsResponse {
  // False until the proxy started once and created its configuration.
  bool exists = 1;
  // The configuration file, e.g. velocity.toml.
  string file = 2;
  // Settings by their path in the file, e.g. "advanced.compression-threshold" or
  // "listeners.0.motd", as JSON: strings, numbers, booleans and lists of strings.
  map<string, string> settings = 3;
  // Settings the manager or the network decides, which can't be changed here.
  repeated LockedProperty locked = 4;
}

message UpdateProxySettingsRequest {
  string server_id = 1;
  // New values by path, as JSON of the same kind as the current value.
  map<string, string> settings = 2;
}

message UpdateProxySettingsResponse {
  // The proxy runs and reloaded its configuration.
  bool reloaded = 1;
}

message GetMaintenanceRequest {
  string server_id = 1;
}

message GetMaintenanceResponse {
  Maintenance maintenance = 1;
}

message ChangeMaintenanceRequest {
  string server_id = 1;
  MaintenanceChange change = 2;
  // The player to add or remove.
  string player = 3;
  // The game server of the network that maintenance is turned on or off for, or that a
  // timer is about, by its name in the configuration of the proxy; empty for the whole
  // network.
  string server = 4;
  // Minutes until a timer starts or ends maintenance, from 1 to MaxMaintenanceMinutes.
  uint32 minutes = 5;
  // Minutes that the maintenance a schedule starts lasts, from 1 to MaxMaintenanceMinutes.
  uint32 duration_minutes = 6;
}

message ChangeMaintenanceResponse {
  Maintenance maintenance = 1;
}

enum MaintenanceChange {
  MAINTENANCE_CHANGE_UNSPECIFIED = 0;
  MAINTENANCE_CHANGE_ON = 1;
  MAINTENANCE_CHANGE_OFF = 2;
  // Adds or removes a player who may join during maintenance.
  MAINTENANCE_CHANGE_ADD = 3;
  MAINTENANCE_CHANGE_REMOVE = 4;
  // Starts or ends maintenance after minutes; a new timer replaces the one that runs.
  MAINTENANCE_CHANGE_START_TIMER = 5;
  MAINTENANCE_CHANGE_END_TIMER = 6;
  // Starts maintenance after minutes, and ends it duration_minutes later.
  MAINTENANCE_CHANGE_SCHEDULE = 7;
  // Aborts the timer that runs, if any.
  MAINTENANCE_CHANGE_ABORT_TIMER = 8;
}

message Maintenance {
  // The plugin created its files, which it does when the proxy loads it.
  bool installed = 1;
  bool enabled = 2;
  // Who may join during maintenance.
  repeated MaintenancePlayer players = 3;
  // The servers in maintenance on their own, by their name in the configuration of the proxy.
  repeated string servers = 4;
  // When the plugin ends the maintenance of the whole network, in Unix seconds, if it keeps
  // its end timer over restarts (continue-endtimer-after-restart); 0 otherwise. The plugin
  // keeps its other timers to itself.
  int64 ends_at = 5;
}

message MaintenancePlayer {
  string name = 1;
  string uuid = 2;
}
