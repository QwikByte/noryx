syntax = "proto3";

package noryx.v1;

import "noryx/v1/backup.proto";

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// DatastoreService is served by every agent and runs the MariaDB and PostgreSQL servers of
// networks: their containers, their databases, each with a user of the same name, and dumps of
// them. Only the servers of a datastore's network reach it: on its node over a Docker network
// without internet, from other nodes over the private network of the nodes. The superuser's
// password never leaves the node.
service DatastoreService {
  // ListDatastores returns the datastores of the node and the versions the agent runs.
  rpc ListDatastores(ListDatastoresRequest) returns (ListDatastoresResponse);
  rpc CreateDatastore(CreateDatastoreRequest) returns (CreateDatastoreResponse);
  rpc StartDatastore(StartDatastoreRequest) returns (StartDatastoreResponse);
  rpc StopDatastore(StopDatastoreRequest) returns (StopDatastoreResponse);
  // UpdateDatastore changes the limits and parameters of a datastore, pulls its image again,
  // moves it to another major version or removes the data a previous version left.
  rpc UpdateDatastore(UpdateDatastoreRequest) returns (UpdateDatastoreResponse);
  // PublishDatastore publishes the port of a datastore at the node's address in the private
  // network of the nodes, for the nodes of its network only, or no longer.
  rpc PublishDatastore(PublishDatastoreRequest) returns (PublishDatastoreResponse);
  // DeleteDatastore removes a datastore with its container, network, data and dumps.
  rpc DeleteDatastore(DeleteDatastoreRequest) returns (DeleteDatastoreResponse);
  // EnsureDatabase creates a database and its user, or sets the user's password, with rights
  // on that database only.
  rpc EnsureDatabase(EnsureDatabaseRequest) returns (EnsureDatabaseResponse);
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseResponse);
  // CreateDump dumps databases of a running datastore into a ZIP archive with one
  // <database>.sql each, kept like the backups of servers.
  rpc CreateDump(CreateDumpRequest) returns (CreateDumpResponse);
  rpc ListDumps(ListDumpsRequest) returns (ListDumpsResponse);
  // RestoreDump drops and creates databases again and loads their dumps as their own users.
  rpc RestoreDump(RestoreDumpRequest) returns (RestoreDumpResponse);
  rpc DeleteDump(DeleteDumpRequest) returns (DeleteDumpResponse);
  // DownloadDump sends a dump in chunks; the first message carries its size.
  rpc DownloadDump(DownloadDumpRequest) returns (stream DownloadDumpResponse);
  // ImportDump adds a dump made elsewhere, e.g. of a database that moves to Noryx. The first
  // message describes it, the data that follows is a ZIP archive with a <database>.sql for
  // each database, or the SQL of a single database. The agent checks it and keeps it like
  // the dumps it makes, so that RestoreDump loads it as the databases' users.
  rpc ImportDump(stream ImportDumpRequest) returns (ImportDumpResponse);
  // ListTables returns the tables of a database of a running datastore.
  rpc ListTables(ListTablesRequest) returns (ListTablesResponse);
  // BrowseTable returns rows of a table as text, with long values cut short. It only reads,
  // with statements the agent builds itself.
  rpc BrowseTable(BrowseTableRequest) returns (BrowseTableResponse);
  // StreamDatastoreLogs sends the last lines of the log of a datastore's container, then
  // follows it until the container stops or the client disconnects, like StreamLogs of
  // servers. The agent hides passwords in the statements that the engines log, e.g. when
  // they fail.
  rpc StreamDatastoreLogs(StreamDatastoreLogsRequest) returns (stream StreamDatastoreLogsResponse);
}

enum DatastoreEngine {
  DATASTORE_ENGINE_UNSPECIFIED = 0;
  DATASTORE_ENGINE_MARIADB = 1;
  DATASTORE_ENGINE_POSTGRES = 2;
}

enum DatastoreState {
  DATASTORE_STATE_UNSPECIFIED = 0;
  DATASTORE_STATE_STOPPED = 1;
  // Running, but not ready for connections yet.
  DATASTORE_STATE_STARTING = 2;
  DATASTORE_STATE_RUNNING = 3;
  // Running, but its health check fails.
  DATASTORE_STATE_UNHEALTHY = 4;
}

message Datastore {
  // Chosen by the master, like the IDs of servers.
  string id = 1;
  DatastoreEngine engine = 2;
  // Major version, e.g. 12.3 for MariaDB or 18 for PostgreSQL.
  string version = 3;
  uint32 memory_mb = 4;
  // Thousandths of a core; 0 means no limit.
  uint32 cpu_millis = 5;
  // Storage location of its data; empty means the default.
  string storage = 6;
  DatastoreState state = 7;
  // Bytes of its data.
  int64 size = 8;
  // Version whose data a change of the major version left, until it is removed.
  string previous_version = 9;
  // Port published at the node's address in the private network; 0 for none.
  uint32 port = 10;
  // Databases of a running datastore, sorted.
  repeated string databases = 11;
  // The parameters of its engine; agents of older versions send none, as they don't know them.
  DatastoreParameters parameters = 12;
}

// DatastoreParameters tune the engine of a datastore, each 0 for its default. The agent
// checks them with Problem and passes them to the database server as options that it builds
// itself from the numbers; no other parameters can be set.
message DatastoreParameters {
  // Connections at once, max_connections; 0 for DefaultConnections.
  uint32 max_connections = 1;
  // MiB of the cache of data, InnoDB's buffer pool or PostgreSQL's shared_buffers; 0 for
  // DefaultBufferMB.
  uint32 buffer_mb = 2;
}

message DatastoreVersions {
  DatastoreEngine engine = 1;
  // Oldest first.
  repeated string versions = 2;
}

message ListDatastoresRequest {}

message ListDatastoresResponse {
  repeated Datastore datastores = 1;
  repeated DatastoreVersions versions = 2;
}

message CreateDatastoreRequest {
  string id = 1;
  DatastoreEngine engine = 2;
  string version = 3;
  uint32 memory_mb = 4;
  uint32 cpu_millis = 5;
  string storage = 6;
  DatastoreParameters parameters = 7;
}

message CreateDatastoreResponse {
  Datastore datastore = 1;
}

message StartDatastoreRequest {
  string id = 1;
}

message StartDatastoreResponse {}

message StopDatastoreRequest {
  string id = 1;
}

message StopDatastoreResponse {}

message UpdateDatastoreRequest {
  string id = 1;
  // The limits it gets, like when it was created.
  uint32 memory_mb = 2;
  uint32 cpu_millis = 3;
  // Pulls the image of its version again.
  bool update_image = 4;
  // A newer major version, or empty for its own: the agent dumps the databases, creates the
  // datastore again on new data and loads the dumps, with the users and their passwords. The
  // old data stays.
  string version = 5;
  // Removes the data a previous version left.
  bool remove_previous = 6;
  // The parameters it gets, like the limits.
  DatastoreParameters parameters = 7;
}

message UpdateDatastoreResponse {
  Datastore datastore = 1;
}

message PublishDatastoreRequest {
  string id = 1;
  // A port of the node, published at its address in the private network; 0 for none.
  uint32 port = 2;
  // Addresses of the nodes in the private network that may reach it; none for no port.
  repeated string clients = 3;
  // The public keys of these nodes in the private network, in the order of clients. The node
  // publishes the port only for its peers with these keys, and closes it to an address once
  // it has another key.
  repeated string client_keys = 4;
}

message PublishDatastoreResponse {
  // The node's address in the private network.
  string address = 1;
}

message DeleteDatastoreRequest {
  string id = 1;
}

message DeleteDatastoreResponse {}

message EnsureDatabaseRequest {
  string id = 1;
  string name = 2;
  // Only lower-case letters and digits 2 to 7, as the master generates them.
  string password = 3;
}

message EnsureDatabaseResponse {}

message DropDatabaseRequest {
  string id = 1;
  string name = 2;
}

message DropDatabaseResponse {}

message CreateDumpRequest {
  string id = 1;
  // Databases to dump; empty for all of them.
  repeated string databases = 2;
  string label = 3;
  string location = 4;
  string job_id = 5;
  // Dumps of the job kept; 0 keeps all. Ignored if retention is set.
  uint32 keep = 6;
  // Which dumps of the job are kept, instead of keep.
  BackupRetention retention = 7;
}

message CreateDumpResponse {
  // Its paths are the databases in it.
  Backup dump = 1;
}

message ListDumpsRequest {
  string id = 1;
}

message ListDumpsResponse {
  repeated Backup dumps = 1;
}

message RestoreDumpRequest {
  string id = 1;
  string dump_id = 2;
  // Databases to restore; empty for all in the dump. Each needs its user on the datastore,
  // as the master creates it.
  repeated string databases = 3;
}

message RestoreDumpResponse {}

message DeleteDumpRequest {
  string id = 1;
  string dump_id = 2;
}

message DeleteDumpResponse {}

message DownloadDumpRequest {
  string id = 1;
  string dump_id = 2;
}

message DownloadDumpResponse {
  int64 size = 1;
  bytes data = 2;
}

message ImportDumpRequest {
  oneof content {
    ImportDumpHeader header = 1;
    bytes data = 2;
  }
}

message ImportDumpHeader {
  string id = 1;
  string label = 2;
  string location = 3;
  // The database whose SQL follows; empty for a ZIP archive.
  string database = 4;
  // Bytes that follow, at most MaxImportedDump; 0 if unknown.
  int64 size = 5;
}

message ImportDumpResponse {
  // Its paths are the databases in it.
  Backup dump = 1;
}

message ListTablesRequest {
  string id = 1;
  string database = 2;
}

message Table {
  // Schema of a PostgreSQL table; empty for MariaDB.
  string schema = 1;
  string name = 2;
  // Estimated number of rows; -1 if the engine doesn't know yet.
  int64 rows = 3;
  // Bytes of its data and indexes.
  int64 size = 4;
}

message ListTablesResponse {
  repeated Table tables = 1;
}

message BrowseTableRequest {
  string id = 1;
  string database = 2;
  string schema = 3;
  string table = 4;
  // Rows skipped, in the order of the sort column if there is one, and then of the primary
  // key if the table has one.
  uint64 offset = 5;
  // Rows returned at most.
  uint32 limit = 6;
  // A column to sort the rows by; empty for none. Agents of older versions ignore it.
  string sort = 7;
  bool descending = 8;
  // Leaves out the rows that don't match; none for all rows.
  TableFilter filter = 9;
}

// TableFilter matches the rows whose value of a column, as text like a page shows it, equals
// a value or contains it.
message TableFilter {
  string column = 1;
  string value = 2;
  // Matches values that contain value, ignoring case, instead of those that equal it.
  bool contains = 3;
}

message TableColumn {
  string name = 1;
  // Its type as the engine names it, e.g. varchar(36).
  string type = 2;
  bool primary_key = 3;
}

message TableValue {
  string text = 1;
  bool null = 2;
  // The text is cut short.
  bool truncated = 3;
}

message TableRow {
  // One for each column.
  repeated TableValue values = 1;
}

message BrowseTableResponse {
  repeated TableColumn columns = 1;
  repeated TableRow rows = 2;
  // The table has more rows after these.
  bool more = 3;
  // The agent sorted and filtered the rows as asked; agents of older versions don't.
  bool sorted_and_filtered = 4;
}

message StreamDatastoreLogsRequest {
  string id = 1;
  // Number of past lines to send first, at most 1000.
  uint32 tail = 2;
  // Leaves out the past lines up to this time, e.g. those a client that connects again
  // has already; 0 leaves out none.
  int64 after_unix_nano = 3;
}

message StreamDatastoreLogsResponse {
  string line = 1;
  // When the container wrote the line; 0 if unknown.
  int64 time_unix_nano = 2;
}
