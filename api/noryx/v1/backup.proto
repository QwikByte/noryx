syntax = "proto3";

package noryx.v1;

import "noryx/v1/file.proto";

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// BackupService is served by every agent and keeps backups of its servers on the node, in
// the backups folder of a storage location, where containers can't reach them. A backup is
// a ZIP archive of the selected files and folders of a server.
service BackupService {
  // ListBackups returns the backups of a server, newest first.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse);
  // CreateBackup archives the selected data of a server. A running game server writes its
  // worlds to disk first and pauses saving meanwhile, so players stay connected.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse);
  // RestoreBackup replaces the files and folders in a backup, or some of them, with their
  // backed up state. A running server is stopped meanwhile and started again.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse);
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse);
  // UpdateBackup changes the label of a backup and whether its job keeps it.
  rpc UpdateBackup(UpdateBackupRequest) returns (UpdateBackupResponse);
  // ListBackupFiles lists a folder of a backup's archive, to choose what to restore.
  rpc ListBackupFiles(ListBackupFilesRequest) returns (ListBackupFilesResponse);
  // DownloadBackup sends the archive in chunks. The first message carries its size, if known.
  rpc DownloadBackup(DownloadBackupRequest) returns (stream DownloadBackupResponse);
  // ImportBackup adds a backup of a server that came from another node. The header
  // describes it, the data that follows is its archive. The agent checks it and keeps it as
  // untrusted like an uploaded backup, whatever the header tells.
  rpc ImportBackup(stream ImportBackupRequest) returns (ImportBackupResponse);
  // ImportCopy keeps a copy of a backup of a server of another node, apart from the backups
  // of the servers of this node, so that the server can be restored if its node is lost. The
  // header names the server, which needn't exist here, and describes the backup. Copies are
  // never restored where they are kept: the master relays them into a server.
  rpc ImportCopy(stream ImportCopyRequest) returns (ImportCopyResponse);
  // DownloadCopy sends the archive of a copy in chunks; the first message carries its size.
  rpc DownloadCopy(DownloadCopyRequest) returns (stream DownloadCopyResponse);
  rpc DeleteCopy(DeleteCopyRequest) returns (DeleteCopyResponse);
  // UploadBackup adds a ZIP archive from elsewhere as a backup of a server, e.g. one that was
  // downloaded before. The header describes it, the data that follows is the archive. The
  // agent checks it like an archive of the file manager and keeps it as untrusted, so that
  // restoring it checks it again and trusts nothing it tells. Its paths are the files and
  // folders at the top of the archive.
  rpc UploadBackup(stream UploadBackupRequest) returns (UploadBackupResponse);
  // ImportMasterBackup keeps an archive of the master, with its database and certificate
  // authority, in the folder master of the backups of a storage location, apart from the
  // backups of the servers. The agent neither reads nor restores it: the master's
  // administrator does, with noryx-master restore. The header names it, the data that follows
  // is the archive.
  rpc ImportMasterBackup(stream ImportMasterBackupRequest) returns (ImportMasterBackupResponse);
  // DeleteMasterBackup deletes an archive of the master that ImportMasterBackup keeps.
  rpc DeleteMasterBackup(DeleteMasterBackupRequest) returns (DeleteMasterBackupResponse);
}

// BackupSelection chooses what of a server is backed up.
message BackupSelection {
  // The whole data directory; the other fields are ignored.
  bool everything = 1;
  // Folders with a level.dat, e.g. world and world_nether.
  bool worlds = 2;
  // The plugins or mods folder; for mods also config/, where they keep their settings.
  bool plugins = 3;
  // Files in the data directory except .jar files and logs, and the config folder.
  bool config = 4;
  // Further files or folders, relative to the data directory. Missing ones are skipped.
  repeated string paths = 5;
  // Files or folders inside the others that are left out, e.g. the tiles of a map plugin.
  // Restoring the backup leaves them as they are.
  repeated string exclude = 6;
}

// BackupRetention tells which backups of a job are kept: the newest ones, and the newest of
// each of the last days, weeks (from Monday) and months that have backups. A backup that
// any of them keeps stays; all zero keeps all.
message BackupRetention {
  uint32 last = 1;
  uint32 days = 2;
  uint32 weeks = 3;
  uint32 months = 4;
  // IANA time zone in which days, weeks and months begin, e.g. the job's; empty for UTC.
  string time_zone = 5;
}

message Backup {
  string id = 1;
  // What the administrator entered, or the name of the job that made the backup.
  string label = 2;
  int64 created_unix = 3;
  int64 size = 4;
  // Storage location that holds the backup.
  string location = 5;
  // Files and folders in the backup, relative to the data directory; "." is everything.
  repeated string paths = 6;
  // Job that made the backup; empty if it was made by hand.
  string job_id = 7;
  // Files and folders inside the paths that the backup left out.
  repeated string exclude = 8;
  // Kept backups are never deleted by their job.
  bool kept = 9;
  // The backup wasn't made by the agent that keeps it but came from elsewhere, e.g. an upload,
  // so restoring it trusts nothing that its archive tells: see UploadBackup.
  bool untrusted = 10;
}

message ListBackupsRequest {
  string server_id = 1;
}

message ListBackupsResponse {
  repeated Backup backups = 1;
}

message CreateBackupRequest {
  string server_id = 1;
  string label = 2;
  BackupSelection selection = 3;
  // Storage location for the backup; empty means the default location.
  string location = 4;
  string job_id = 5;
  // Whether a server without any of the selected data, e.g. one that never started, is
  // skipped: the response has no backup then. Otherwise that is an error.
  bool skip_without_data = 6;
  // Which backups of the job are kept for the server; none keeps all. The others are deleted
  // once the new backup exists. Backups made by hand, and kept ones, are never deleted this way.
  BackupRetention retention = 7;
}

message CreateBackupResponse {
  Backup backup = 1;
}

message RestoreBackupRequest {
  string server_id = 1;
  string backup_id = 2;
  // Files and folders of the backup to restore, relative to the data directory; empty for
  // all it holds. Each must be in the backup.
  repeated string paths = 3;
  // Backs up what the restore replaces first, as a backup made by hand in the storage
  // location of the restored one.
  bool snapshot_first = 4;
}

message RestoreBackupResponse {
  // The backup that snapshot_first made; none if the server had none of the paths.
  Backup snapshot = 1;
}

message DeleteBackupRequest {
  string server_id = 1;
  string backup_id = 2;
}

message DeleteBackupResponse {}

message UpdateBackupRequest {
  string server_id = 1;
  string backup_id = 2;
  // Only what is set changes.
  optional string label = 3;
  optional bool kept = 4;
}

message UpdateBackupResponse {
  Backup backup = 1;
}

message ListBackupFilesRequest {
  string server_id = 1;
  string backup_id = 2;
  // Folder in the backup, relative to the data directory; empty for its top.
  string path = 3;
}

message ListBackupFilesResponse {
  // Folders first, then files, each sorted by name; a folder's size is that of all in it.
  // Files that only hold secrets aren't listed.
  repeated FileInfo files = 1;
  // Set if the folder has more entries than the agent lists.
  bool truncated = 2;
}

message DownloadBackupRequest {
  string server_id = 1;
  string backup_id = 2;
  // Hides the secrets like ArchiveDirectoryRequest.hide_secrets; the size of the archive
  // isn't known in advance then.
  bool hide_secrets = 3;
}

message DownloadBackupResponse {
  // Size of the archive, 0 if unknown.
  int64 size = 1;
  bytes data = 2;
}

message ImportBackupHeader {
  string server_id = 1;
  // The backup keeps its ID; location chooses where it is kept on this node.
  Backup backup = 2;
}

message ImportBackupRequest {
  oneof content {
    ImportBackupHeader header = 1;
    bytes data = 2;
  }
}

message ImportBackupResponse {
  Backup backup = 1;
}

message ImportCopyRequest {
  oneof content {
    // server_id names the server of another node that the backup is of.
    ImportBackupHeader header = 1;
    bytes data = 2;
  }
}

message ImportCopyResponse {
  Backup backup = 1;
}

message DownloadCopyRequest {
  // The server of another node that the backup is of.
  string server_id = 1;
  string backup_id = 2;
}

message DownloadCopyResponse {
  // Size of the archive in the first message.
  int64 size = 1;
  bytes data = 2;
}

message DeleteCopyRequest {
  string server_id = 1;
  string backup_id = 2;
}

message DeleteCopyResponse {}

message UploadBackupHeader {
  string server_id = 1;
  string label = 2;
  // Storage location for the backup; empty means the default location.
  string location = 3;
  // Size of the archive if known, so that one that doesn't fit is refused before it is sent.
  int64 size = 4;
}

message UploadBackupRequest {
  oneof content {
    UploadBackupHeader header = 1;
    bytes data = 2;
  }
}

message UploadBackupResponse {
  Backup backup = 1;
}

// MasterBackup names an archive of the master on the node.
message MasterBackup {
  // The name of its file, see MasterBackupName.
  string name = 1;
  // Storage location of the archive; empty means the default location.
  string location = 2;
}

message ImportMasterBackupRequest {
  oneof content {
    MasterBackup header = 1;
    bytes data = 2;
  }
}

message ImportMasterBackupResponse {
  // Size of the archive as the node keeps it.
  int64 size = 1;
}

message DeleteMasterBackupRequest {
  MasterBackup backup = 1;
}

message DeleteMasterBackupResponse {}
