syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// EnrollmentService is served by the master. A freshly installed agent calls it
// exactly once, using a single-use join token, to obtain its node certificate.
service EnrollmentService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

message EnrollRequest {
  string node_id = 1;
  // Secret part of the join token. Only its hash is stored on the master.
  string secret = 2;
  // PKCS#10 certificate signing request. The private key never leaves the node.
  bytes csr_der = 3;
}

message EnrollResponse {
  // The node's certificate, issued by the CA of the join token.
  bytes certificate_der = 1;
}
