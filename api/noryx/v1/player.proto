syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// PlayerService manages the players of game servers with the commands and lists of
// Minecraft: kicks, bans, the whitelist and operators.
service PlayerService {
  // GetPlayerLists returns who is banned, whitelisted and operator on a game server, as its
  // files tell, and the changes that wait for it to run.
  rpc GetPlayerLists(GetPlayerListsRequest) returns (GetPlayerListsResponse);
  // ChangePlayers makes changes one after the other, e.g. bans several players, and tells how
  // each ended. A running game server runs the command of a change at once; one that doesn't
  // run runs it once it does, and only a kick fails then.
  rpc ChangePlayers(ChangePlayersRequest) returns (ChangePlayersResponse);
}

enum PlayerAction {
  PLAYER_ACTION_UNSPECIFIED = 0;
  PLAYER_ACTION_KICK = 1;
  PLAYER_ACTION_BAN = 2;
  PLAYER_ACTION_PARDON = 3;
  PLAYER_ACTION_WHITELIST_ADD = 4;
  PLAYER_ACTION_WHITELIST_REMOVE = 5;
  PLAYER_ACTION_OP = 6;
  PLAYER_ACTION_DEOP = 7;
  // Turning the whitelist on or off takes no player.
  PLAYER_ACTION_WHITELIST_ON = 8;
  PLAYER_ACTION_WHITELIST_OFF = 9;
}

message GetPlayerListsRequest {
  string server_id = 1;
}

message GetPlayerListsResponse {
  repeated ListedPlayer banned = 1;
  repeated ListedPlayer whitelisted = 2;
  repeated ListedPlayer operators = 3;
  bool whitelist_enabled = 4;
  // Changes that wait for the server to run or for their time, in their order.
  repeated PlayerChange pending = 5;
  // Players who joined the server, as its cache of players (usercache.json) tells, e.g. to
  // whitelist or ban them while they're offline. Only their names and IDs are set.
  repeated ListedPlayer joined = 6;
}

message ListedPlayer {
  string name = 1;
  string uuid = 2;
  // Why, since when and by whom a player is banned; empty in the other lists.
  string reason = 3;
  int64 created_unix = 4;
  string source = 5;
  // When a temporary ban ends, e.g. one of a plugin; 0 for bans without an end.
  int64 expires_unix = 6;
}

message PlayerChange {
  PlayerAction action = 1;
  string name = 2;
  // Shown to a player who is kicked or banned.
  string reason = 3;
  // The ID Floodgate gives a Bedrock player, whom the servers behind its proxy can't look
  // up: whitelisting them writes it into the whitelist.
  string uuid = 4;
  // When a ban ends: the agent pardons the player then, or once the server runs again if it
  // doesn't run at that time. Only bans take it; a later ban or pardon replaces it.
  int64 ends_unix = 5;
  // When a waiting change is due, e.g. the pardon at the end of a ban; 0 for changes that
  // only wait for the server to run. Only the agent sets it, in the changes that wait.
  int64 due_unix = 6;
}

message ChangePlayersRequest {
  string server_id = 1;
  // Up to 100 changes.
  repeated PlayerChange changes = 2;
}

message ChangePlayersResponse {
  // How each change ended, in their order.
  repeated PlayerChangeResult results = 1;
}

message PlayerChangeResult {
  // The server doesn't run and runs the command once it does.
  bool pending = 1;
  // What the server answered, without formatting.
  string output = 2;
  // Why the change failed; the others were made nonetheless.
  string error = 3;
}
