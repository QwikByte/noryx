syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// StatsService tells what the node and its servers use. The agent measures it every few
// seconds, so a call returns the latest measurement right away.
service StatsService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

message GetStatsRequest {}

message GetStatsResponse {
  // When the agent measured. Rates are averages since the measurement before.
  int64 time_unix = 1;
  NodeStats node = 2;
  repeated ServerStats servers = 3;
  // The datastores of the node.
  repeated DatastoreStats datastores = 4;
}

message NodeStats {
  // CPU time used, in thousandths of a core.
  uint32 cpu_millis = 1;
  uint32 cpu_count = 2;
  uint64 memory_used_bytes = 3;
  uint64 memory_total_bytes = 4;
}

message ServerStats {
  string id = 1;
  // Stopped servers only have the size of their data.
  bool running = 2;
  // CPU time used, in thousandths of a core.
  uint32 cpu_millis = 3;
  uint64 memory_bytes = 4;
  // Most memory the server may use, including what the JVM needs beyond its heap.
  uint64 memory_limit_bytes = 5;
  uint64 network_received_bytes_per_second = 6;
  uint64 network_sent_bytes_per_second = 7;
  // Size of the server's data, measured every few minutes; 0 until it was measured.
  uint64 disk_bytes = 8;
  // Players on the server, or in the whole network for a proxy. Missing if the server
  // didn't answer, e.g. while it starts.
  Players players = 9;
  // Ticks per second over the last minute, 20 at best; 0 if unknown. Only Paper and
  // Purpur tell it.
  double tps = 10;
  // A running game server outside of networks that runs in offline mode: anyone who
  // reaches its port can join under any name.
  bool offline_mode = 11;
  // Most CPU time the server may use, in thousandths of a core; 0 if it isn't limited.
  uint32 cpu_limit_millis = 12;
  // A proxy, whose players are those of its network's game servers.
  bool proxy = 13;
}

message Players {
  uint32 online = 1;
  uint32 max = 2;
  // Names of the players online: of all, up to 1000, if the console of a game server
  // answers, otherwise of some, as the server lists them.
  repeated string names = 3;
}

message DatastoreStats {
  string id = 1;
  // Stopped datastores only have the size of their data.
  bool running = 2;
  // CPU time used, in thousandths of a core.
  uint32 cpu_millis = 3;
  uint64 memory_bytes = 4;
  // Most memory the datastore may use.
  uint64 memory_limit_bytes = 5;
  // Most CPU time the datastore may use, in thousandths of a core; 0 if it isn't limited.
  uint32 cpu_limit_millis = 6;
  // Clients connected to the datastore, without the agent itself. Missing while it isn't
  // ready to tell, e.g. as it starts.
  optional uint32 connections = 7;
  // Size of its data, measured every few minutes.
  uint64 disk_bytes = 8;
}
