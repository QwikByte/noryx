syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// FileService is served by every agent and gives access to the files of a server.
// Paths are relative to the server's data directory and use forward slashes; an empty
// path is the directory itself. Paths can't leave the directory. Files that only hold
// secrets, such as the RCON password, are hidden and can't be read, written or moved, and
// files with secrets among other settings show them as "<hidden>"; writing such a file
// keeps the secret wherever it still says so.
service FileService {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  // ReadFile sends a file in chunks. The first message carries the file size and version.
  rpc ReadFile(ReadFileRequest) returns (stream ReadFileResponse);
  // WriteFile creates or replaces a file. The first message names the file, the others
  // carry its content. The file only appears once it has been written completely.
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  // ArchiveDirectory sends a directory, or files and folders in it, as a ZIP archive in chunks.
  rpc ArchiveDirectory(ArchiveDirectoryRequest) returns (stream ArchiveDirectoryResponse);
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  // MoveFile renames or moves a file or directory. It never replaces an existing one.
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse);
  // DeleteFile deletes a file, or a directory with everything in it.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  // HashFiles tells the SHA-512 hashes of files, e.g. so that the master learns which files
  // of a modpack changed since it wrote them.
  rpc HashFiles(HashFilesRequest) returns (HashFilesResponse);
  // ExtractArchive extracts a ZIP or .tar.gz archive of the server into a folder, as the
  // server's user. The archive is untrusted: links, special files and paths that leave the
  // folder, the files that hold secrets of the server or that Noryx writes itself, too many
  // entries, too much data and a too high compression ratio refuse it before anything is
  // written.
  rpc ExtractArchive(ExtractArchiveRequest) returns (ExtractArchiveResponse);
  // CopyFile copies a file or folder within the server's data, like MoveFile moves it: files
  // with secrets of the server can't be copied, and the copy never replaces anything.
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse);
  // SearchFiles searches the text files of a folder and the folders in it for a text, as the
  // panel shows them: files that only hold secrets are left out, and others show them as
  // "<hidden>". It stops after a while, at large files and after many matches.
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
}

message FileInfo {
  string name = 1;
  bool directory = 2;
  int64 size = 3;
  int64 modified_unix = 4;
  // The file set that wrote the file, whose next apply replaces changes made here.
  string file_set = 5;
}

message ListFilesRequest {
  string server_id = 1;
  string path = 2;
}

message ListFilesResponse {
  // Directories first, then files, each sorted by name.
  repeated FileInfo files = 1;
  // Set if the directory has more entries than the agent lists.
  bool truncated = 2;
}

message ReadFileRequest {
  string server_id = 1;
  string path = 2;
  // Reads only part of the file, e.g. the end of a large log: from offset, or with a negative
  // offset from that many bytes before the end, and at most limit bytes; 0 reads to the end.
  // Offsets count in the file as the panel sees it, with hidden secrets.
  int64 offset = 3;
  int64 limit = 4;
}

message ReadFileResponse {
  // The size of what is sent, which hidden secrets change.
  int64 size = 1;
  bytes data = 2;
  // The version of the file, in the first message.
  FileVersion version = 3;
  // Where what is sent starts in the file, and the size of the whole file, in the first
  // message if part of the file was asked for.
  int64 offset = 4;
  int64 file_size = 5;
}

// FileVersion tells a version of a file apart from others, by when it was last modified and
// its size on the disk. A hash of the content wouldn't do, as the panel only sees secrets as
// "<hidden>".
message FileVersion {
  int64 modified_unix_nano = 1;
  int64 size = 2;
}

message WriteFileRequest {
  oneof content {
    WriteFileHeader header = 1;
    bytes data = 2;
  }
}

message WriteFileHeader {
  string server_id = 1;
  string path = 2;
  // Replace an existing file; otherwise writing to an existing file fails.
  bool overwrite = 3;
  // Size of the file if known, so that one that doesn't fit is refused before it is sent.
  int64 size = 4;
  // Replace the file only while it still has this version, e.g. the one an editor opened;
  // otherwise the write fails with FAILED_PRECONDITION. A file that is gone has changed too.
  FileVersion expected = 5;
}

message WriteFileResponse {
  FileInfo file = 1;
  FileVersion version = 2;
}

message ArchiveDirectoryRequest {
  string server_id = 1;
  string path = 2;
  // Leaves out the files that only hold secrets, such as the RCON password, and replaces
  // the secrets in others, as for the panel's users. Moves need all of it.
  bool hide_secrets = 3;
  // Files and folders in path to archive instead of all of it, by their paths relative to
  // path, which name them in the archive.
  repeated string paths = 4;
}

message ArchiveDirectoryResponse {
  bytes data = 1;
}

message CreateDirectoryRequest {
  string server_id = 1;
  string path = 2;
}

message CreateDirectoryResponse {}

message MoveFileRequest {
  string server_id = 1;
  string from = 2;
  string to = 3;
}

message MoveFileResponse {}

message DeleteFileRequest {
  string server_id = 1;
  string path = 2;
}

message DeleteFileResponse {}

message HashFilesRequest {
  string server_id = 1;
  // Up to MaxHashPaths paths.
  repeated string paths = 2;
}

message HashFilesResponse {
  // The hex SHA-512 hash of each regular file by its path in the request. A path that is
  // something else, a file with secrets or one larger than MaxHashedSize maps to "".
  // Missing files are left out.
  map<string, string> sha512 = 1;
}

message ExtractArchiveRequest {
  string server_id = 1;
  // The archive, a file of the server.
  string path = 2;
  // The folder to extract into, which is created if it is missing; empty for the server's
  // folder.
  string destination = 3;
  // Replace existing files; otherwise an archive with a file that exists already is refused.
  bool overwrite = 4;
}

message ExtractArchiveResponse {
  // The files extracted, and their size.
  int64 files = 1;
  int64 size = 2;
}

message CopyFileRequest {
  string server_id = 1;
  string from = 2;
  // Where the copy goes, which must not exist.
  string to = 3;
}

message CopyFileResponse {}

message SearchFilesRequest {
  string server_id = 1;
  // The folder to search, with the folders in it; empty for the server's folder.
  string path = 2;
  // The text to find, regardless of case.
  string query = 3;
}

// SearchMatch is a line of a file that holds the text searched for.
message SearchMatch {
  // Relative to the server's folder.
  string path = 1;
  // The number of the line, from 1.
  int64 line = 2;
  // The line, shortened if it is long.
  string text = 3;
}

message SearchFilesResponse {
  repeated SearchMatch matches = 1;
  // Set if the search stopped before it searched all files: after many matches or a while.
  bool truncated = 2;
  // The files searched, and those left out as they are too large.
  int64 files = 3;
  int64 too_large = 4;
}
