syntax = "proto3";

package noryx.v1;

option go_package = "github.com/QwikByte/noryx/api/noryx/v1;noryxv1";

// FileSetService is served by every agent and keeps the files of file sets on its servers:
// files that the master manages for groups of servers, e.g. the configuration of a plugin or
// an image. Each server records in its data which set wrote which file. Files that hold
// secrets of a set are hidden like the RCON password, also after they left the set.
service FileSetService {
  // ApplyFileSet writes the files of a set to a server, with its secrets filled in, and
  // removes those the set no longer has unless they changed on the server since. An unknown
  // placeholder, a missing secret or a path that another set wrote fails before anything
  // is written.
  rpc ApplyFileSet(ApplyFileSetRequest) returns (ApplyFileSetResponse);
  // RemoveFileSet takes a set off a server, e.g. as it is no longer a target.
  rpc RemoveFileSet(RemoveFileSetRequest) returns (RemoveFileSetResponse);
  // ListFileSets returns the sets on each server of the node, and which files changed since
  // they were written.
  rpc ListFileSets(ListFileSetsRequest) returns (ListFileSetsResponse);
}

message FileSetFile {
  // Relative to the server's data directory, with forward slashes.
  string path = 1;
  // UTF-8 text. {{secret:<name>}} and {{datastore:<name>.<database>.password}} are filled
  // in from the secrets of the request.
  string content = 2;
  // Writes the file only if the server has none, for files that plugins rewrite.
  bool only_if_missing = 3;
  // The content of a binary file, e.g. an image, instead of content; nothing is filled in.
  bytes data = 4;
}

message ApplyFileSetRequest {
  string server_id = 1;
  string set_id = 2;
  // The set's name, which the file manager shows next to its files.
  string set_name = 3;
  int64 version = 4;
  // Identifies what the master sent, which ListFileSets returns; the master tells by it
  // whether the server has the newest state of the set.
  string revision = 5;
  repeated FileSetFile files = 6;
  // The values of the placeholders that only the agent fills in, by what is between the
  // braces, e.g. secret:db-password or datastore:main.luckperms.password.
  map<string, string> secrets = 7;
  // Only tells what would change.
  bool dry_run = 8;
}

enum FileSetAction {
  FILE_SET_ACTION_UNSPECIFIED = 0;
  FILE_SET_ACTION_UNCHANGED = 1;
  FILE_SET_ACTION_CREATED = 2;
  FILE_SET_ACTION_CHANGED = 3;
  FILE_SET_ACTION_REMOVED = 4;
  // The set no longer has the file, which changed on the server since it was written, so it
  // stays as a file of the server.
  FILE_SET_ACTION_KEPT = 5;
}

message FileSetChange {
  string path = 1;
  FileSetAction action = 2;
  // The file holds secrets, so the panel never shows it.
  bool secret = 3;
}

message ApplyFileSetResponse {
  repeated FileSetChange changes = 1;
}

enum FileSetRemoval {
  FILE_SET_REMOVAL_UNSPECIFIED = 0;
  // Removes the files with secrets. The others stay part of the set, until applying it
  // removes them.
  FILE_SET_REMOVAL_SECRETS = 1;
  // Removes the files with secrets and the others that didn't change since they were
  // written. Changed files stay as files of the server.
  FILE_SET_REMOVAL_UNCHANGED = 2;
  // Removes the files with secrets. The others stay as files of the server.
  FILE_SET_REMOVAL_FORGET = 3;
}

message RemoveFileSetRequest {
  string server_id = 1;
  string set_id = 2;
  FileSetRemoval removal = 3;
  bool dry_run = 4;
}

message RemoveFileSetResponse {
  repeated FileSetChange changes = 1;
}

message ListFileSetsRequest {}

message ListFileSetsResponse {
  // Only servers that have files of sets.
  repeated ServerFileSets servers = 1;
}

message ServerFileSets {
  string server_id = 1;
  repeated AppliedFileSet sets = 2;
}

message AppliedFileSet {
  string set_id = 1;
  int64 version = 2;
  string revision = 3;
  repeated AppliedFile files = 4;
}

message AppliedFile {
  string path = 1;
  bool secret = 2;
  bool only_if_missing = 3;
  // The file differs from what was written, or is gone.
  bool changed = 4;
  bool missing = 5;
}
