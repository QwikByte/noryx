# Builds a release of both programs for Linux: packages, archives, checksums and the installer.
# The release workflow runs it for tags v*; try it locally with: goreleaser release --snapshot --clean
version: 2

project_name: noryx

before:
  hooks:
    - make web
    # The installer installs the version it was released with.
    - sh -c 'mkdir -p bin && sed "s/^version=latest$/version=v{{ .Version }}/" packaging/install.sh > bin/install.sh'

builds:
  - &build
    id: noryx-master
    main: ./cmd/noryx-master
    binary: noryx-master
    # grpcnotrace leaves out golang.org/x/net/trace, whose debug pages nothing serves.
    tags: [ui, grpcnotrace]
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X github.com/QwikByte/noryx/internal/buildinfo.Version=v{{ .Version }}"]
  - <<: *build
    id: noryx-agent
    main: ./cmd/noryx-agent
    binary: noryx-agent
    tags: [grpcnotrace]

archives:
  - &archive
    id: noryx-master
    ids: [noryx-master]
    name_template: "{{ .Binary }}_{{ .Version }}_linux_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - docs/installation.md
      - src: packaging/master/noryx-master.service
        strip_parent: true
      - src: packaging/master/master.env
        strip_parent: true
  - <<: *archive
    id: noryx-agent
    ids: [noryx-agent]
    files:
      - LICENSE
      - README.md
      - docs/installation.md
      - src: packaging/agent/noryx-agent.service
        strip_parent: true
      - src: packaging/agent/noryx-overlay.service
        strip_parent: true
      - src: packaging/agent/noryx-isolate.service
        strip_parent: true
      - src: packaging/agent/agent.env
        strip_parent: true

nfpms:
  - &package
    id: noryx-master
    ids: [noryx-master]
    package_name: noryx-master
    file_name_template: "{{ .PackageName }}_{{ .Version }}_linux_{{ .Arch }}"
    formats: [deb, rpm, archlinux]
    vendor: QwikByte
    maintainer: QwikByte
    homepage: https://github.com/QwikByte/noryx
    license: MIT
    section: admin
    description: Admin panel and control plane of Noryx, which manages Minecraft servers and networks on any number of nodes.
    dependencies: [systemd]
    contents:
      - src: packaging/master/noryx-master.service
        dst: /usr/lib/systemd/system/noryx-master.service
      - src: packaging/master/sysusers.conf
        dst: /usr/lib/sysusers.d/noryx-master.conf
      - src: packaging/master/noryx-master-update.service
        dst: /usr/lib/systemd/system/noryx-master-update.service
      - src: packaging/master/noryx-master-update.path
        dst: /usr/lib/systemd/system/noryx-master-update.path
      # Updates from the panel run the installer of the installed release.
      - src: bin/install.sh
        dst: /usr/lib/noryx-master/install.sh
        file_info:
          mode: 0755
      - src: packaging/master/master.env
        dst: /etc/noryx/master.env
        type: config|noreplace
    scripts:
      postinstall: packaging/master/postinstall.sh
      preremove: packaging/master/preremove.sh
      postremove: packaging/postremove.sh
    archlinux:
      scripts:
        postupgrade: packaging/master/postinstall.sh
  - <<: *package
    id: noryx-agent
    ids: [noryx-agent]
    package_name: noryx-agent
    description: Node agent of Noryx, which runs the Minecraft servers of a machine in Docker or Podman.
    dependencies: []
    contents:
      - src: packaging/agent/noryx-agent.service
        dst: /usr/lib/systemd/system/noryx-agent.service
      - src: packaging/agent/noryx-overlay.service
        dst: /usr/lib/systemd/system/noryx-overlay.service
      - src: packaging/agent/noryx-isolate.service
        dst: /usr/lib/systemd/system/noryx-isolate.service
      - src: bin/install.sh
        dst: /usr/lib/noryx-agent/install.sh
        file_info:
          mode: 0755
      - src: packaging/agent/agent.env
        dst: /etc/noryx/agent.env
        type: config|noreplace
    scripts:
      postinstall: packaging/agent/postinstall.sh
      preremove: packaging/agent/preremove.sh
      postremove: packaging/postremove.sh
    archlinux:
      scripts:
        postupgrade: packaging/agent/postinstall.sh

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: bin/install.sh

# The release workflow writes the notes with scripts/release-notes.sh and passes them with --release-notes.
release:
  prerelease: auto
  # The release workflow publishes the draft once it has signed checksums.txt.
  draft: true
  replace_existing_draft: true
  extra_files:
    - glob: bin/install.sh
